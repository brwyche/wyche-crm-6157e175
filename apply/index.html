<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wyche Capital | Investor Loan Inquiry</title><meta name="robots" content="noindex">
<style>
:root{--navy:#0b1f3a;--gold:#c9a227}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1a1a1a}
header{background:var(--navy);color:#fff;text-align:center;padding:18px 12px;border-bottom:4px solid var(--gold)}header img{height:64px}header h1{margin:8px 0 2px;font-size:1.3rem}header p{margin:0;color:var(--gold);font-size:.9rem}
form{max-width:560px;margin:16px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 1px 4px #0002}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:.95rem}input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:.88rem}.c input{width:auto;margin-top:3px}
button{width:100%;margin-top:18px;padding:14px;font-size:1.05rem;font-weight:700;background:var(--gold);color:var(--navy);border:0;border-radius:6px}
small{color:#666}footer{text-align:center;font-size:.8rem;color:#666;padding:10px 10px 30px}
</style></head><body>
<header><img src="../sig/logo_sig.png" alt="Wyche Capital"><h1>Investor Loan Inquiry</h1><p>DSCR Rentals &middot; Fix &amp; Flip &middot; New Construction</p></header>
<form action="https://formsubmit.co/dscrlender@gmail.com" method="POST">
<input type="hidden" name="_subject" value="New Investor Inquiry - Wyche Capital">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="true">
<input type="hidden" name="_next" value="https://brwyche.github.io/wyche-crm-6157e175/apply/thanks/">
<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<small>Takes about 2 minutes. We never ask for your SSN, date of birth or bank info here.</small>
<label>Full name *</label><input name="Name" required autocomplete="name">
<div class="row"><div><label>Email *</label><input type="email" name="email" required autocomplete="email"></div>
<div><label>Phone *</label><input type="tel" name="Phone" required autocomplete="tel"></div></div>
<div class="row"><div><label>Market *</label><select name="Market" required><option value="">Choose</option><option>Cincinnati, OH</option><option>Dayton, OH</option><option>Raleigh, NC</option><option>Durham, NC</option><option>Other</option></select></div>
<div><label>Loan type *</label><select name="Loan Type" required><option value="">Choose</option><option>DSCR rental purchase</option><option>DSCR refinance</option><option>Fix and flip</option><option>New construction</option></select></div></div>
<label>Property address <small>(if known)</small></label><input name="Property Address">
<div class="row"><div><label>Purchase price</label><input name="Purchase Price" inputmode="numeric" placeholder="$"></div>
<div><label>Rehab budget <small>(flips)</small></label><input name="Rehab Budget" inputmode="numeric" placeholder="$"></div></div>
<div class="row"><div><label>Est. credit score</label><select name="Credit Range"><option value="">Choose</option><option>760+</option><option>740-759</option><option>720-739</option><option>700-719</option><option>680-699</option><option>660-679</option><option>Below 660</option><option>Not sure</option></select></div>
<div><label>Timeline</label><select name="Timeline"><option value="">Choose</option><option>Under contract now</option><option>Within 30 days</option><option>1-3 months</option><option>Just exploring</option></select></div></div>
<div class="row"><div><label>Rentals owned</label><select name="Rentals Owned"><option>0</option><option>1-2</option><option>3-5</option><option>6-10</option><option>11+</option></select></div>
<div><label>Flips (last 3 yrs)</label><select name="Flips Last 3 Years"><option>0</option><option>1-2</option><option>3-5</option><option>6-10</option><option>11+</option></select></div></div>
<label>Notes</label><textarea name="Notes" rows="3"></textarea>
<label class="c"><input type="checkbox" name="Consent" value="Yes" required> I agree that Wyche Capital may contact me by phone, text or email about my loan inquiry.</label>
<button type="submit">Submit Inquiry</button></form>
<footer>Wyche Capital &middot; (283) 235-6079 &middot; www.wychecapital.com</footer></body></html>
